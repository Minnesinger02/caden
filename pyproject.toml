[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "caden-encoder"
version = "0.2.0"
description = "Train and run a compact candidate decision encoder"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["torch>=2.6,<3", "transformers>=4.51,<5", "safetensors>=0.5", "huggingface-hub>=0.34,<1"]

[project.scripts]
caden-train = "caden.train:main"
caden-infer = "caden.infer:main"

[project.urls]
Repository = "https://github.com/Minnesinger02/caden"
Models = "https://huggingface.co/Leonard02/caden-encoder-mixed"

[tool.setuptools.packages.find]
include = ["caden*", "decision_lab*"]
